[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meow-now"
dynamic = ["version"]
description = "Talk to a cat: speech in, meows out. Plus four cats with opinions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
meow-now = "meow_now.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "meow_now.__version__" }

[tool.setuptools.packages.find]
include = ["meow_now*"]

[tool.setuptools.package-data]
meow_now = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest asserts
