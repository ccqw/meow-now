name: publish-image

# Builds the container image on every PR (build only, on a GitHub-hosted
# runner) and, on main and on version tags, builds and pushes it.
#
# Where it pushes and where it runs are repository VARIABLES, so a fork can
# publish to its own registry without editing this file:
#
#   IMAGE_REGISTRY  registry plus namespace, e.g. ghcr.io/<owner> (the
#                   default) or registry.example.com
#   IMAGE_RUNNER    runner label for push builds (default: ubuntu-latest).
#                   The image is built for the runner's own architecture, so
#                   point this at an arm64 runner for an arm64 cluster.
#   IMAGE_AUTH_FILE optional path, on the runner, of a docker config.json
#                   with push credentials (for a self-hosted runner that has
#                   one mounted). Without it, ghcr.io is logged in to with
#                   GITHUB_TOKEN and other registries need no login step.
#
# Tags: `sha-<commit>` on every push, plus `main` or the version tag. The run
# summary prints the digest to pin in your deployment.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PRs (including from forks) never run on a self-hosted runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.IMAGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      AUTH_FILE: ${{ vars.IMAGE_AUTH_FILE }}
    steps:
      - name: Mask the registry name in logs
        run: echo "::add-mask::${REGISTRY}"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Image name and tags
        id: meta
        run: |
          image="${REGISTRY,,}/meow-now"
          tags="${image}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="${tags},${image}:main"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Use the runner's registry credential
        if: env.PUSH == 'true' && env.AUTH_FILE != ''
        run: |
          if [ ! -s "${AUTH_FILE}" ]; then
            echo "::error::IMAGE_AUTH_FILE is set but the file is missing on this runner"
            exit 1
          fi
          install -D -m 600 "${AUTH_FILE}" "$HOME/.docker/config.json"

      - name: Log in to GHCR
        if: env.PUSH == 'true' && env.AUTH_FILE == '' && startsWith(env.REGISTRY, 'ghcr.io')
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: env.PUSH != 'true'
        run: |
          docker buildx build --load -t meow-now:smoke .
          docker run -d --name smoke -p 8080:8080 meow-now:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -X POST http://127.0.0.1:8080/api/cats/random/monologue | head -c 200

      - name: Record the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### meow-now image published"
            echo
            echo "Tag \`sha-${GITHUB_SHA}\`, digest \`${DIGEST}\`."
            echo "Pin it as \`<registry>/meow-now:sha-${GITHUB_SHA}@${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"
